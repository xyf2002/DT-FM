# Asteroid Cluster Inventory
# ==========================
# Update this file with your actual cluster nodes
# Format matches cluster.conf: IP  NIC  RANK  GPU_ID

[master]
# Master node (Rank 0) - runs the rendezvous service
master_node ansible_host=10.203.54.10 ansible_user='ubuntu' rank=0 gpu_id=0 nic=ens33 hostname=master-node

[workers]
# Worker nodes - update with your actual edge devices
# Examples:
# 192.168.1.11 nic=eth0 rank=1 gpu_id=0 hostname=jetson-nano-1 arch=aarch64
# 192.168.1.12 nic=eth0 rank=2 gpu_id=0 hostname=jetson-nx-1 arch=aarch64
# 192.168.1.13 nic=eth0 rank=3 gpu_id=0 hostname=gpu-server-1 arch=x86_64
worker1 ansible_host=10.203.53.10 ansible_user='ubuntu' rank=1 gpu_id=0 nic=ens33 hostname=worker1
worker3 ansible_host=10.203.56.10 ansible_user='ubuntu' rank=3 gpu_id=0 nic=ens33 hostname=worker3

[all:vars]
ansible_python_interpreter=/usr/bin/python3

[cluster:children]
master
workers

[cluster:vars]
ansible_python_interpreter=/usr/bin/python3
asteroid_venv=/opt/asteroid/venv
asteroid_src=/opt/asteroid/src
